<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Democratic Decline and Renewal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap">
<style>
  /* Layout: a small conference site in the register of law.yale.edu/isp (Playfair Display headings, Raleway text, Yale blue, light-grey bands).
     Home, Schedule (a time grid, every block a link), one page per session, Speakers. Hash routing, one file. rsvp.html is deliberately not linked from here. */
  :root {
    --bg: #ffffff; --paper: #ffffff; --band: #f7f7f7; --band2: #ececec; --ink: #333333; --text: #4a4a4a; --muted: #6b6b6b; --line: #dddddd;
    --yale: #00356b; --link: #00356b;
    --plenary: #e6edf5; --plenary-ink: #1f2f44; --breakout: #ffffff; --breakout-ink: #333333; --keynote: #f3f0e8; --keynote-ink: #3d3526;
    --social: #f1f1f1; --social-ink: #4a4a4a; --pause-ink: #7a7a7a;
    --display: "Playfair Display", Georgia, "Times New Roman", serif;
    --body: "Raleway", Avenir, "Helvetica Neue", Arial, sans-serif;
    --row: 32px;
  }
    --link: #9dbbe0; --plenary: #2f5a8a; --breakout: #1b232c; --breakout-ink: #e8edf2; --keynote: #2a3b4d; --keynote-ink: #dfe8f2; --social: #2a2f36; --social-ink: #d5dbe2; --pause-ink: #9aa8b6; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--body); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: var(--link); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; }

  /* top: YLS strip, then the ISP band in Yale blue */
  .yls { background: #ffffff; border-bottom: 1px solid #dfe5ec; }
  .yls .bar-in { padding: 9px 16px; }
  .yls img { height: 26px; width: auto; display: block; }
  .bar { position: sticky; top: 0; z-index: 5; background: var(--yale); color: #fff; }
  .bar-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .mark { display: flex; align-items: center; text-decoration: none; }
  .mark img { height: 40px; width: auto; display: block; }
  nav { display: flex; gap: 2px; }
  nav a { text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px; color: rgba(255,255,255,0.85); border-bottom: 2px solid transparent; }
  nav a.on, nav a:hover { color: #fff; border-bottom-color: #fff; }
  nav a:focus-visible, .ev:focus-visible, .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--yale); }
  h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 4.5vw, 44px); line-height: 1.12; margin: 0; color: var(--ink); text-wrap: balance; }
  h2 { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.2; margin: 0 0 10px; color: var(--ink); text-wrap: balance; }
  .section > h2::before { content: ""; display: block; width: 44px; height: 3px; background: var(--yale); margin-bottom: 12px; }
  h3 { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.25; margin: 0 0 4px; color: var(--ink); }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .btn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; font-size: 13.5px; letter-spacing: 0.06em; text-transform: uppercase; padding: 11px 20px; background: var(--yale); color: #fff; border: 2px solid var(--yale); }
  .btn:hover { background: #002a55; border-color: #002a55; }
  .btn.ghost { background: transparent; color: var(--link); border-color: var(--yale); }
  .btn.ghost:hover { background: var(--band2); }

  /* home */
  .hero { background: var(--band); border: 1px solid var(--line); border-top: 4px solid var(--yale); padding: clamp(26px, 4vw, 44px) clamp(20px, 5vw, 48px); margin-bottom: 36px; display: grid; gap: 14px; }
  .hero h1 { max-width: 20ch; }
  .ribbon { display: flex; align-items: center; justify-content: space-between; gap: 8px 16px; flex-wrap: wrap; background: var(--band2); padding: 12px 16px; }
  .ribbon b { font-family: var(--display); font-weight: 700; font-size: 20px; color: var(--ink); }
  .ribbon span { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text); }
  .hero .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .section { margin-bottom: 40px; display: grid; gap: 12px; }
  .section p { max-width: 70ch; }
  .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px 32px; }
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 12px 28px; }
  .person { border-left: 3px solid var(--yale); padding: 2px 0 2px 14px; min-width: 0; }
  .person .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.25; color: var(--ink); }
  .person .af { font-size: 13.5px; color: var(--muted); line-height: 1.4; }

  /* schedule grid */
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; margin: 14px 0 20px; }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .sw { width: 16px; height: 14px; display: inline-block; border: 1px solid var(--line); border-left: 3px solid var(--yale); }
  .sw.keynote { border-left-color: #8a7a52; } .sw.social { border-left-color: #9a9a9a; }
  .days { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .days { grid-template-columns: 1fr; } }
  .day { background: var(--paper); border: 1px solid var(--line); border-top: 4px solid var(--yale); padding: 0 0 20px; min-width: 0; overflow: hidden; }
  .day-head { background: var(--band); padding: 16px 18px 12px; border-bottom: 1px solid var(--line); }
  .day h2 { font-size: 24px; margin: 0 0 2px; }
  .day .when { font-size: 13px; color: var(--muted); margin: 0; }
  .grid-wrap { padding: 14px 16px 0; }
  .grid { display: grid; grid-template-columns: 58px 1fr; grid-auto-rows: var(--row); column-gap: 10px; position: relative; padding: 0 8px 0 0; }
  .grid::before { content: ""; position: absolute; inset: 0; background: var(--paper); z-index: 0; }
  .grid > * { position: relative; z-index: 1; }
  .tick { grid-column: 1; font-size: 12.5px; color: var(--muted); text-align: right; padding-right: 4px; transform: translateY(-9px); font-variant-numeric: tabular-nums; }
  .rule { grid-column: 2; border-top: 1px solid var(--line); height: 0; align-self: start; pointer-events: none; }
  .ev { grid-column: 2; padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; border: 1px solid var(--line); border-left: 4px solid var(--yale); }
  a.ev:hover .n { text-decoration: underline; }
  .ev .t { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev .n { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.25; color: var(--ink); text-wrap: balance; }
  .ev .p { font-size: 13px; line-height: 1.35; color: var(--text); }
  .ev .k { font-size: 12px; font-style: italic; color: var(--muted); }
  .plenary { background: var(--plenary); color: var(--plenary-ink); }
  .breakout { background: var(--breakout); color: var(--breakout-ink); }
  .keynote { background: var(--keynote); color: var(--keynote-ink); border-left-color: #8a7a52; }
  .social { background: var(--social); color: var(--social-ink); border-left-color: #9a9a9a; }
  .pause { background: transparent; color: var(--pause-ink); border: 0; padding-block: 2px; justify-content: center; overflow: hidden; }
  .pause .n { font-family: var(--body); font-style: italic; font-size: 13px; color: var(--pause-ink); }
  .pause .p { font-size: 12px; }
  .pair { grid-column: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; min-width: 0; }
  .pair .ev { grid-column: auto; }
  .pair .ev .n { font-size: 15px; }
  .pair .ev .p { font-size: 12.5px; }
  .pair .ev .t, .keynote .t, .social .t { display: none; }
  .keynote, .social { padding-block: 6px; }
  .social .k { display: none; }

  /* session page */
  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }
  .crumbs a { color: var(--muted); }
  .evhead { padding: 22px 22px 20px; margin-bottom: 24px; display: grid; gap: 8px; border: 1px solid var(--line); }
  .evhead.plenary, .evhead.keynote, .evhead.social, .evhead.breakout { border-left: 6px solid var(--yale); }
  .evhead.keynote { border-left-color: #8a7a52; } .evhead.social { border-left-color: #9a9a9a; }
  .evhead h1 { font-size: clamp(26px, 4vw, 38px); max-width: 24ch; color: inherit; }
  .evhead .k { font-size: 13px; font-style: italic; color: var(--muted); }
  .evhead .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
  .evhead .meta a { color: inherit; }
  .evbody { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .evbody { grid-template-columns: 1fr; } }
  .desc { display: grid; gap: 12px; }
  .desc p { max-width: 64ch; }
  .tba { background: var(--band); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; font-size: 14.5px; }
  .speakers { display: grid; gap: 12px; }
  .speakers.two-col { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  .spk { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--yale); padding: 14px 16px; min-width: 0; }
  .spk .nm { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--ink); }
  .spk .af { font-size: 13.5px; color: var(--muted); }
  .spk .bio { font-size: 14px; margin-top: 6px; }
  .tbc { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .tbc.ok { color: var(--link); }
  .nextprev { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .nextprev a { font-size: 14px; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); background: var(--paper); max-width: 48%; font-family: var(--display); font-weight: 700; color: var(--ink); }
  .nextprev a span { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="yls"><div class="bar-in"><a href="https://law.yale.edu" target="_blank" rel="noopener"><img src="assets/yls-logo.png" alt="Yale Law School"></a></div></div>
<div class="bar"><div class="bar-in">
  <a class="mark" href="#home" aria-label="Home"><img src="assets/isp-logo.png" alt="Information Society Project, Yale Law School"></a>
  <nav id="nav"><a href="#home">Home</a><a href="#schedule">Schedule</a><a href="#speakers">Speakers</a></nav>
</div></div>

<div class="wrap" id="app"></div>

<script>
  // ---------- data ----------
  const DAYS = [
    { id: 1, name: "Day 1", when: "Friday, April 2, 2027", start: 9 * 60, end: 19 * 60 + 45 },
    { id: 2, name: "Day 2", when: "Saturday, April 3, 2027", start: 9 * 60, end: 14 * 60 + 15 },
  ];
  // Shown on the Speakers page with a "to be confirmed" caveat; nobody is attached to a session until confirmed.
  const SPEAKERS_TBC = [
    { n: "Jack M. Balkin", a: "Yale Law School", b: "Knight Professor of Constitutional Law and the First Amendment; Director of the Information Society Project.", confirmed: true },
    { n: "Cristina Rodríguez", a: "Dean, Yale Law School", b: "Dean of Yale Law School; co-chair of the 2021 Presidential Commission on the Supreme Court; scholar of immigration and constitutional law." },
  ];
  const EVENTS = [
    { id: "executive-power", day: 1, s: 540, e: 630, kind: "plenary", k: "Plenary", n: "Reforming Executive Power", sub: "Reforming the Justice Department",
      d: ["How can executive power be reformed, and accountability rebuilt, after the expansion of presidential authority? This panel considers how to restrain executive power, codify norms, empower Congress and develop durable checks on the executive, with particular attention to the Justice Department.",
          "Panelists will identify concrete changes to executive-branch practices and legal safeguards, who could implement them, and how they would operate when existing checks are resisted or weakened."] },
    { id: "break-1a", day: 1, s: 630, e: 645, kind: "pause", n: "Break" },
    { id: "anti-corruption", day: 1, s: 645, e: 735, kind: "breakout", k: "Breakout", n: "Anti-Corruption and Cronyism", pair: "d1b",
      d: ["How do corporate interests capture government officials, regulators and lawmakers, and what institutional reforms can prevent corruption and cronyism? This session tests possible changes to government contracting, emoluments safeguards, the use of pardons and revolving-door rules.",
          "Panelists will ask how private-public arrangements let consequential decisions move out of public view, and how to hold private companies accountable when they assume state functions."] },
    { id: "surveillance-state", day: 1, s: 645, e: 735, kind: "breakout", k: "Breakout", n: "Reforming the Surveillance State", pair: "d1b",
      d: ["How can state surveillance be limited in ways that protect democracy and civil liberties? This session considers safeguards against agencies circumventing constitutional limits by purchasing personal data from private companies, alongside reforms to surveillance authority, oversight, transparency and accountability.",
          "Panelists will assess legal and institutional safeguards for AI-enabled surveillance and explain how litigation and advocacy can advance reform. Broader questions of AI governance are taken up in AI and Democracy on Day 2."] },
    { id: "lunch-1", day: 1, s: 735, e: 810, kind: "pause", n: "Lunch" },
    { id: "campaign-finance", day: 1, s: 810, e: 900, kind: "plenary", k: "Plenary", n: "Campaign Finance and the Party System",
      d: ["How do campaign-finance rules shape political parties' capacity to organize, recruit candidates and sustain democratic participation? Parties' influence is tied to control over money and voter data, so reform of the party system has to be considered alongside campaign-finance reform.",
          "Panelists will assess proposals such as small-donor public financing, changes to the rules governing parties and outside groups, and institutional reforms to strengthen parties' accountability and inclusive candidate recruitment."] },
    { id: "break-1b", day: 1, s: 900, e: 915, kind: "pause", n: "Break" },
    { id: "voting-rights", day: 1, s: 915, e: 1005, kind: "plenary", k: "Plenary", n: "Reforming Representation and Voting Rights",
      d: ["How can representation and voting rights be strengthened as federal protections and judicial remedies narrow? Gerrymandering and primary reform belong here.",
          "Panelists will assess reforms through state constitutional litigation, independent redistricting commissions, congressional regulation and changes to primary systems, and ask how to reduce self-interest in redistricting and translate reform ideas into workable legislation."] },
    { id: "break-1c", day: 1, s: 1005, e: 1020, kind: "pause", n: "Break" },
    { id: "keynote", day: 1, s: 1020, e: 1065, kind: "keynote", k: "Keynote", n: "Keynote conversation", p: "5:00–5:45 pm",
      d: ["A fireside conversation to close the first day on the state of American democracy, drawing the day's threads together: voting rights, redistricting and the reform of executive power.",
          "The conversation is separate from the panel sessions and runs 45 minutes, followed by cocktails and dinner."] },
    { id: "cocktails", day: 1, s: 1110, e: 1140, kind: "social", k: "Evening", n: "Cocktails", p: "6:30 pm",
      d: ["Drinks for all participants before dinner. Venue to be announced."] },
    { id: "dinner", day: 1, s: 1140, e: 1185, kind: "social", k: "Evening", n: "Dinner", p: "7:00 pm, venue to be announced",
      d: ["Conference dinner for all participants. Venue to be announced."] },

    { id: "congress", day: 2, s: 540, e: 615, kind: "plenary", k: "Plenary", n: "Rebuilding Congress and Amending the Constitution",
      d: ["How can Congress rebuild its capacity to gather expertise, exercise its powers and control appropriations? Congress retains hard powers, among them the power to declare war, the power of the purse and the contempt power, alongside the prerogatives of speech and debate, internal discipline over members and rulemaking.",
          "Panelists will identify reforms that would help Congress use those powers effectively: the role of committee chairs, the capacity of congressional agencies, and whether oversight or good-government functions could be placed with Congress. The panel focuses on institutional capacity and implementation, including the amendment process."] },
    { id: "break-2a", day: 2, s: 615, e: 630, kind: "pause", n: "Break" },
    { id: "knowledge-institutions", day: 2, s: 630, e: 690, kind: "breakout", k: "Breakout", n: "Reviving Knowledge Institutions", pair: "d2b",
      d: ["How can the institutions that produce and sustain public knowledge, including journalism and universities, be revived? Disinformation and conspiracy theories belong within this discussion.",
          "Panelists will consider how digital platforms and AI affect the production, distribution and credibility of information, and what institutions can change to rebuild trust and establish shared facts, developing proposals for journalism reform and other institutional practices that affirm accuracy while protecting freedom of expression."] },
    { id: "ai-democracy", day: 2, s: 630, e: 690, kind: "breakout", k: "Breakout", n: "AI and Democracy", pair: "d2b",
      d: ["How can AI governance protect democracy and the public interest? Panelists will develop concrete reforms and explain who could implement them.",
          "The discussion focuses on democratic safeguards, public accountability and the institutions needed to govern AI. Surveillance-specific safeguards are addressed in Reforming the Surveillance State on Day 1."] },
    { id: "break-2b", day: 2, s: 690, e: 705, kind: "pause", n: "Break" },
    { id: "court-reform", day: 2, s: 705, e: 780, kind: "plenary", k: "Plenary", n: "Court Reform",
      d: ["This panel weighs the courts' role as a check on constitutional violations against the consequences when courts are captured, ignored or rendered ineffective.",
          "Panelists will examine proposals concerning jurisdiction, judicial ethics and term limits, including how those changes could restore accountability and effective remedies. The discussion may also consider federalism, court expansion and state courts as forums for rights protection."] },
    { id: "closing", day: 2, s: 790, e: 840, kind: "plenary", k: "Closing plenary, lunch served", n: "Closing Plenary on Universities and Civil Society",
      d: ["The law is a powerful instrument for challenging inequality, oppression and marginalization. Yet durable change seldom follows from legal argument alone. Reform ideas developed in the academy and the legal profession reach a wider democratic audience, and translate into meaningful action, only when they are joined to organizing, coalition-building and a sophisticated understanding of community, politics and power.",
          "This plenary asks what people in universities and civil society should do next. Drawing on the conference's reform proposals, participants will consider the responsibilities of universities in research, teaching and public engagement, and the roles of civil-society organizations in advocacy, organizing and coalition-building. The aim is for attendees to leave with concrete ways to advance democratic renewal."] },
    { id: "end", day: 2, s: 840, e: 855, kind: "pause", n: "Conference closes" },
  ];
  const SESSIONS = EVENTS.filter(e => e.kind !== "pause");

  // ---------- helpers ----------
  const fmt = m => { const h24 = Math.floor(m / 60), mm = m % 60; return `${((h24 + 11) % 12) + 1}:${String(mm).padStart(2, "0")}`; };
  const ampm = m => fmt(m) + (m < 720 ? " am" : " pm");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dayOf = ev => DAYS.find(d => d.id === ev.day);
  const sessionOf = id => SESSIONS.find(s => s.id === id);

  // ---------- pages ----------
  function home() {
    const organizers = [
      ["Jack M. Balkin", "Knight Professor of Constitutional Law and the First Amendment; Director, Information Society Project"],
      ["Genevieve Scott", "Clinical Professor of Law; Senior Fellow, Program for the Study of Reproductive Justice"],
      ["Caleb Yong", "Resident Fellow, Information Society Project"],
      ["Laura Matta", "Resident Fellow, Information Society Project"],
      ["Henry Bradley", "Fellow, Information Society Project and Program for the Study of Reproductive Justice"],
    ];
    return `
    <section class="hero">
      <div class="eyebrow">Information Society Project · Yale Law School · Spring Conference 2027</div>
      <h1>Democratic Decline and Renewal in the Digital Age</h1>
      <div class="ribbon" aria-label="Dates and venue"><b>April 2–3, 2027</b><span>Yale Law School · New Haven, Connecticut</span></div>
      <div class="actions"><a class="btn" href="#schedule">See the schedule</a><a class="btn ghost" href="#speakers">Speakers</a></div>
    </section>

    <section class="section">
      <h2>About the conference</h2>
      <p><em>Democratic Decline and Renewal</em> is the Information Society Project's spring conference for 2027, held at Yale Law School in New Haven on Friday, April 2 and Saturday, April 3. This conference is part of the ISP’s new Constitution and Rule of Law (CAROL) Project. Its subject is institutional reform: how the institutions of American constitutional democracy might be repaired, and how its fundamental values might be revived.</p>
      <p>The participants are legal scholars, leaders of the legal profession, and people who have worked in government and in civil society organizations. Over the two days they will take up the question of how to respond to democratic backsliding and to threats to the constitutional order. Each panel is devoted to a single theme, and each is asked to offer concrete proposals as well as diagnoses.</p>
      <p>Before the conference, every contributor writes a short essay of 1,000 to 1,500 words, due by March 24, 2027. The essays are circulated in advance so that participants can see the questions and concerns they share. With the authors' permission, they will later be published together as an online symposium on <a href="https://balkin.blogspot.com" rel="noopener">Balkinization</a>.</p>
    </section>

    <section class="section">
      <h2>How the two days run</h2>
      <div class="cols">
        <div><h3>Friday, April 2</h3><p>The first day opens with a plenary on executive power, followed by two breakout sessions held in parallel, a plenary on campaign finance and the party system, and a plenary on representation and voting rights. A keynote conversation at 5:00 pm closes the day, followed by cocktails and dinner.</p></div>
        <div><h3>Saturday, April 3</h3><p>The second day begins with a plenary on Congress and the amendment process, followed by two parallel breakout sessions and a plenary on court reform. A closing plenary on universities and civil society is held over lunch. The conference ends at 2:00 pm.</p></div>
        <div><h3>Reading</h3><p>The essays for each panel will be circulated in advance, and participants are asked to read them before the conference.</p></div>
        <div><h3>Attendance</h3><p>The conference is open to the Yale Law School community and a limited number of invited guests. It is an invitation-only, closed-door event.</p></div>
      </div>
    </section>

    <section class="section">
      <h2>Convened by</h2>
      <div class="people">
        ${organizers.map(([n, t]) => `<div class="person"><div class="nm">${esc(n)}</div><div class="af">${esc(t)}</div></div>`).join("")}
      </div>
      <p class="muted">The Information Society Project is an intellectual center at Yale Law School studying the implications of the Internet and new information technologies for law and society.</p>
    </section>`;
  }

  function schedule() {
    return `<div class="eyebrow">Program</div><h1 style="margin-bottom:8px">Schedule</h1>
      <p class="muted">Breakout sessions run in parallel. Click a session for its description.</p>
      <div class="legend">
        <span><i class="sw plenary"></i>Plenary</span><span><i class="sw breakout"></i>Breakout, in parallel</span>
        <span><i class="sw keynote"></i>Keynote conversation</span><span><i class="sw social"></i>Cocktails and dinner</span></div>
      <div class="days" id="days"></div>`;
  }
  function buildGrid() {
    const root = document.getElementById("days"); if (!root) return;
    const row = (day, m, up) => (up ? Math.ceil : Math.floor)((m - day.start) / 15) + 1;
    for (const day of DAYS) {
      const sec = document.createElement("section"); sec.className = "day";
      sec.innerHTML = `<div class="day-head"><h2>${day.name}</h2><p class="when">${day.when}</p></div>`;
      const wrap = document.createElement("div"); wrap.className = "grid-wrap";
      const grid = document.createElement("div"); grid.className = "grid";
      grid.style.gridTemplateRows = `repeat(${row(day, day.end, true) - 1}, var(--row))`;
      for (let m = day.start; m <= day.end; m += 60) {
        const r = row(day, m);
        const tick = document.createElement("div"); tick.className = "tick"; tick.style.gridRow = `${r}`; tick.textContent = ampm(m).replace(" ", ""); grid.appendChild(tick);
        const rule = document.createElement("div"); rule.className = "rule"; rule.style.gridRow = `${r}`; grid.appendChild(rule);
      }
      const card = ev => {
        const isLink = ev.kind !== "pause";
        const d = document.createElement(isLink ? "a" : "div");
        d.className = `ev ${ev.kind}`; if (isLink) d.href = `#${ev.id}`;
        const time = `<span class="t">${fmt(ev.s)}–${fmt(ev.e)}</span>`;
        const k = ev.k ? `<span class="k">${esc(ev.k)}</span>` : "";
        const p = ev.kind === "pause" ? (ev.p ? `<span class="p">${esc(ev.p)}</span>` : "") : `<span class="p">${esc(ev.p || ev.sub || "")}</span>`;
        d.innerHTML = ev.kind === "pause"
          ? `<span class="n">${esc(ev.n)}${ev.n === "Lunch" ? ` · ${fmt(ev.s)}–${fmt(ev.e)}` : ""}</span>${p}`
          : `${time}${k}<span class="n">${esc(ev.n)}</span>${p}`;
        return d;
      };
      const evs = EVENTS.filter(e => e.day === day.id); const done = new Set();
      for (const ev of evs) {
        if (done.has(ev.id)) continue;
        let el;
        if (ev.pair) {
          el = document.createElement("div"); el.className = "pair";
          for (const it of evs.filter(x => x.pair === ev.pair)) { el.appendChild(card(it)); done.add(it.id); }
        } else { el = card(ev); done.add(ev.id); }
        const r1 = row(day, ev.s), r2 = row(day, ev.e, true);
        el.style.gridRow = `${r1} / ${r2}`;
        const rowPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row")) || 28;
        const topOff = ((ev.s - day.start) / 15 - (r1 - 1)) * rowPx;
        const botOff = ((r2 - 1) - (ev.e - day.start) / 15) * rowPx;
        el.style.marginTop = `${topOff + 2}px`; el.style.marginBottom = `${botOff + 2}px`;
        grid.appendChild(el);
      }
      wrap.appendChild(grid); sec.appendChild(wrap); root.appendChild(sec);
    }
  }

  function eventPage(ev) {
    const day = dayOf(ev);
    const i = SESSIONS.indexOf(ev); const prev = SESSIONS[i - 1], next = SESSIONS[i + 1];
    const parallel = ev.pair ? SESSIONS.filter(x => x.pair === ev.pair && x !== ev) : [];
    const isPanel = ev.kind === "plenary" || ev.kind === "breakout" || ev.kind === "keynote";
    return `
    <div class="crumbs"><a href="#home">Home</a> › <a href="#schedule">Schedule</a> › ${esc(ev.n)}</div>
    <div class="evhead ${ev.kind}">
      <div class="k">${esc(ev.k || "")} · ${day.name}</div>
      <h1>${esc(ev.n)}</h1>
      ${ev.sub ? `<p style="font-size:17px;opacity:.9">${esc(ev.sub)}</p>` : ""}
      <div class="meta"><span><b>${day.when}</b></span><span>${ampm(ev.s)} to ${ampm(ev.e)}</span>${parallel.length ? `<span>Held in parallel with ${parallel.map(x => `<a href="#${x.id}">${esc(x.n)}</a>`).join(" and ")}</span>` : ""}${ev.kind === "plenary" || ev.kind === "keynote" ? "<span>All participants</span>" : ""}</div>
    </div>
    <div class="evbody">
      <div class="desc">${(ev.d || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      <div>${isPanel ? `<h2>Participants</h2><div class="tba"><p>${ev.kind === "keynote" ? "The conversation partners" : "The panelists"} will be announced here once confirmed.</p></div>` : ""}</div>
    </div>
    <div class="nextprev">
      ${prev ? `<a href="#${prev.id}"><span>Previous</span>${esc(prev.n)}</a>` : "<span></span>"}
      ${next ? `<a href="#${next.id}" style="text-align:right"><span>Next</span>${esc(next.n)}</a>` : ""}
    </div>`;
  }

  function speakersPage() {
    const cards = SPEAKERS_TBC.map(p => `<div class="spk"><div class="nm">${esc(p.n)}</div><div class="af">${esc(p.a)}</div><div class="bio">${esc(p.b)}</div><div class="tbc${p.confirmed ? " ok" : ""}">${p.confirmed ? "Confirmed" : "To be confirmed"}</div></div>`).join("");
    return `<div class="eyebrow">Participants</div><h1 style="margin-bottom:8px">Speakers</h1>
      <p class="muted" style="margin-bottom:18px">Participants will be listed here, with their sessions, as they are confirmed.</p>
      <div class="speakers two-col">${cards}</div>
      <div class="tba" style="margin-top:18px"><p>Further participants from the legal academy, government and civil society will be added as they are confirmed.</p><p class="muted">The program and participants are subject to change.</p></div>`;
  }

  // ---------- router: in-page links switch views here, without leaving the page ----------
  let route = (location.hash || "#home").slice(1).toLowerCase();
  function render() {
    const h = route;
    const app = document.getElementById("app");
    let page = "home";
    if (h === "schedule") { app.innerHTML = schedule(); buildGrid(); page = "schedule"; }
    else if (h === "speakers") { app.innerHTML = speakersPage(); page = "speakers"; }
    else if (sessionOf(h)) { app.innerHTML = eventPage(sessionOf(h)); page = "schedule"; }
    else { app.innerHTML = home(); }
    app.insertAdjacentHTML("beforeend", `<footer><span>Information Society Project, Yale Law School, 127 Wall Street, New Haven, CT 06511</span><span>Program and participants subject to change</span></footer>`);
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === `#${page}`));
    window.scrollTo({ top: 0 });
  }
  function go(id) {
    route = id.toLowerCase();
    try { if (location.hash.slice(1).toLowerCase() !== route) history.replaceState(null, "", "#" + route); } catch (e) {}
    render();
  }
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    e.preventDefault(); go(a.getAttribute("href").slice(1));
  });
  window.addEventListener("hashchange", () => { const h = (location.hash || "#home").slice(1).toLowerCase(); if (h !== route) { route = h; render(); } });
  render();
</script>

</body>
</html>
