  :root {

    --row: 32px;
  }
    --link: #9dbbe0; --plenary: #2f5a8a; --breakout: #1b232c; --breakout-ink: #e8edf2; --keynote: #2a3b4d; --keynote-ink: #dfe8f2; --social: #2a2f36; --social-ink: #d5dbe2; --pause-ink: #9aa8b6; color-scheme: dark; }

  a { color: var(--link); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 56px; }

  .bar { position: sticky; top: 0; z-index: 5; background: var(--yale); color: #fff; }
  .bar-in { max-width: 1080px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .mark { display: flex; align-items: center; text-decoration: none; }
  .mark img { height: 40px; width: auto; display: block; }
  nav { display: flex; gap: 2px; }
  nav a { text-decoration: none; font-size: 13px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px; color: rgba(255,255,255,0.85); border-bottom: 2px solid transparent; }

  h3 { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.25; margin: 0 0 4px; color: var(--ink); }

  .muted { color: var(--muted); }

  .hero { background: var(--band); border: 1px solid var(--line); border-top: 4px solid var(--yale); padding: clamp(26px, 4vw, 44px) clamp(20px, 5vw, 48px); margin-bottom: 36px; display: grid; gap: 14px; }

  .person .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.25; color: var(--ink); }
  .person .af { font-size: 13.5px; color: var(--muted); line-height: 1.4; }

  .grid::before { content: ""; position: absolute; inset: 0; background: var(--paper); z-index: 0; }
  .grid > * { position: relative; z-index: 1; }
  .tick { grid-column: 1; font-size: 12.5px; color: var(--muted); text-align: right; padding-right: 4px; transform: translateY(-9px); font-variant-numeric: tabular-nums; }
  .rule { grid-column: 2; border-top: 1px solid var(--line); height: 0; align-self: start; pointer-events: none; }
  .ev { grid-column: 2; padding: 8px 12px; min-width: 0; display: flex; flex-direction: column; gap: 2px; text-decoration: none; border: 1px solid var(--line); border-left: 4px solid var(--yale); }
  a.ev:hover .n { text-decoration: underline; }
  .ev .t { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev .n { font-family: var(--display); font-weight: 700; font-size: 16px; line-height: 1.25; color: var(--ink); text-wrap: balance; }
  .ev .p { font-size: 13px; line-height: 1.35; color: var(--text); }
  .ev .k { font-size: 12px; font-style: italic; color: var(--muted); }
  .plenary { background: var(--plenary); color: var(--plenary-ink); }
  .breakout { background: var(--breakout); color: var(--breakout-ink); }
  .keynote { background: var(--keynote); color: var(--keynote-ink); border-left-color: #8a7a52; }
  .social { background: var(--social); color: var(--social-ink); border-left-color: #9a9a9a; }
  .pause { background: transparent; color: var(--pause-ink); border: 0; padding-block: 2px; justify-content: center; overflow: hidden; }
  .pause .n { font-family: var(--body); font-style: italic; font-size: 13px; color: var(--pause-ink); }
  .pause .p { font-size: 12px; }
  .pair { grid-column: 2; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 8px; min-width: 0; }
  .pair .ev { grid-column: auto; }
  .pair .ev .n { font-size: 15px; }
  .pair .ev .p { font-size: 12.5px; }
  .pair .ev .t, .keynote .t, .social .t { display: none; }
  .keynote, .social { padding-block: 6px; }
  .social .k { display: none; }

  .crumbs { font-size: 13px; color: var(--muted); margin-bottom: 14px; }

  .evhead.keynote { border-left-color: #8a7a52; } .evhead.social { border-left-color: #9a9a9a; }
  .evhead h1 { font-size: clamp(26px, 4vw, 38px); max-width: 24ch; color: inherit; }
  .evhead .k { font-size: 13px; font-style: italic; color: var(--muted); }
  .evhead .meta { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; }
  .evhead .meta a { color: inherit; }
  .evbody { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 28px; align-items: start; }
  @media (max-width: 760px) { .evbody { grid-template-columns: 1fr; } }
  .desc { display: grid; gap: 12px; }
  .desc p { max-width: 64ch; }
  .tba { background: var(--band); border: 1px solid var(--line); padding: 14px 16px; display: grid; gap: 6px; font-size: 14.5px; }
  .speakers { display: grid; gap: 12px; }
  .speakers.two-col { grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); }
  .spk { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--yale); padding: 14px 16px; min-width: 0; }
  .spk .nm { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.2; color: var(--ink); }
  .spk .af { font-size: 13.5px; color: var(--muted); }
  .spk .bio { font-size: 14px; margin-top: 6px; }
  .tbc { display: block; margin-top: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .tbc.ok { color: var(--link); }
  .spk .ses { margin-top: 8px; font-size: 13px; }
  .people { display: grid; gap: 10px; }
  .nextprev { display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap; }
  .nextprev a { font-size: 14px; text-decoration: none; padding: 10px 14px; border: 1px solid var(--line); background: var(--paper); max-width: 48%; font-family: var(--display); font-weight: 700; color: var(--ink); }
  .nextprev a span { display: block; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

  footer { margin-top: 40px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>

  const EVENTS = [
    { id: "welcome", day: 1, s: 540, e: 550, kind: "pause", n: "Welcome and announcements" },

      d: ["This panel asks how Congress can rebuild its capacity to gather expertise, exercise its powers, and control appropriations. On one account the President has effectively wrested the power of the purse from Congress, deciding what revenue is collected and what is spent through unilateral tariffs, impoundment, and the circumvention of ordinary appropriations. Set against it is the view that Congress retains substantially more constitutional authority than it typically exercises: hard powers such as the power to declare war, the power of the purse, and the contempt power, alongside the prerogatives of speech and debate, internal discipline over members, and rulemaking, each reinforcing the others when actually put to use. On this view Congress’s debilitation is not merely a loss of power to the executive but a self-inflicted failure to use the power it has kept.",

    { id: "lunch-1", day: 1, s: 735, e: 810, kind: "pause", n: "Lunch" },

      d: ["How far has executive authority expanded beyond the checks historically imposed on it, and what mechanisms remain available to constrain a branch that increasingly proceeds as though unbound by them? This panel asks how to reform executive power and rebuild accountability after the expansion of presidential authority, with particular attention to the Justice Department.",
          "Panelists will consider how to restrain executive power, codify norms, empower Congress, and develop checks on the executive, and how democracies maintain accountability over executive rule-making once power has been delegated away from the legislature. The discussion will identify concrete changes to executive branch practices and legal safeguards, who could implement them, and how they would operate when existing checks are resisted or weakened."] },
    { id: "break-2a", day: 2, s: 615, e: 630, kind: "pause", n: "Break" },
    { id: "knowledge-institutions", day: 2, s: 630, e: 690, kind: "breakout", k: "Breakout", n: "Reviving Knowledge Institutions", pair: "d2b",
      d: ["Universities, the press, and government scientific offices are knowledge institutions essential to democracy: they produce the reliable information citizens need for informed participation. This panel asks how to revive the institutions that produce and sustain public knowledge, including journalism and universities. Disinformation and conspiracy theories belong within this discussion. Traditional mass media relied on gatekeepers to warrant the reliability of what they conveyed; social media has no equivalent, and produces something closer to large-scale circles of gossip in which truth is measured by the solidarity of the group rather than by any external authority.",
          "Panelists will consider how digital platforms and AI affect the production, distribution, and credibility of information, and what institutions can change to rebuild trust and establish shared facts. The discussion will develop proposals for journalism reform and other institutional practices that affirm accuracy while protecting freedom of expression."] },
    { id: "ai-democracy", day: 2, s: 630, e: 690, kind: "breakout", k: "Breakout", n: "AI and Democracy", pair: "d2b",
      d: ["This panel asks how AI governance can protect democracy and the public interest. AI systems are now capable of massive and sophisticated disinformation campaigns, and more and more of public life is channeled through a narrow set of technology companies. Speakers will develop concrete reforms and explain who could implement them.",
          "The discussion will focus on democratic safeguards, public accountability, and the institutions needed to govern AI. Surveillance-specific safeguards are addressed in Reforming the Surveillance State."] },
    { id: "break-2b", day: 2, s: 690, e: 705, kind: "pause", n: "Break" },
    { id: "court-reform", day: 2, s: 705, e: 780, kind: "plenary", k: "Plenary", n: "Court Reform",
      d: ["This panel weighs the courts’ role as a check on constitutional violations against the consequences when the courts themselves are captured, ignored, or rendered ineffective. Recent decisions have permitted district courts to entertain challenges to executive overreach while denying them the authority to order an effective remedy, a combination that leaves open a jurisdictional gap the executive may exploit for extended periods. The panel also asks what happens when the judiciary becomes enmeshed in the political conflict it is charged with adjudicating, and what remains of judicial independence, in fact rather than in form, under those conditions.",
          "Panelists will examine proposals concerning jurisdiction, judicial ethics, and term limits, including how those changes could restore accountability and effective remedies. The discussion may also consider federalism, court expansion, and state courts as forums for rights protection."] },
    { id: "closing", day: 2, s: 790, e: 840, kind: "plenary", k: "Closing plenary, lunch served", n: "Civil Society and Directions Forward",
      d: ["The law is a powerful instrument for challenging inequality, oppression, and marginalization. Yet durable change seldom follows from legal argument alone. Reform ideas developed in the academy and the legal profession reach a wider democratic audience, and translate into meaningful action, only when they are joined to organizing, coalition-building, and a sophisticated understanding of community, politics, and power.",
          "This plenary asks what people in universities and civil society should do next. Drawing on the conference’s reform proposals, participants will consider the responsibilities of universities in research, teaching, and public engagement, and the roles of civil-society organizations in advocacy, organizing, and coalition-building: how legal advocacy can support broader efforts toward structural change, how reform proposals build sustained public support, and how legal education might better prepare advocates for work that extends well beyond the courtroom. The aim is for attendees to leave with concrete ways to advance democratic renewal."] },
    { id: "end", day: 2, s: 840, e: 855, kind: "pause", n: "Conference closes" },
  ];
  const SESSIONS = EVENTS.filter(e => e.kind !== "pause");

  // ---------- helpers ----------
  const fmt = m => { const h24 = Math.floor(m / 60), mm = m % 60; return `${((h24 + 11) % 12) + 1}:${String(mm).padStart(2, "0")}`; };
  const ampm = m => fmt(m) + (m < 720 ? " am" : " pm");
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const dayOf = ev => DAYS.find(d => d.id === ev.day);
  const sessionOf = id => SESSIONS.find(s => s.id === id);

  // ---------- pages ----------
  function home() {
    const organizers = [
      ["Jack M. Balkin", "Knight Professor of Constitutional Law and the First Amendment; Director, Information Society Project"],
      ["Genevieve Scott", "Clinical Professor of Law; Senior Fellow, Program for the Study of Reproductive Justice"],
      ["Caleb Yong", "Resident Fellow, Information Society Project"],
      ["Laura Matta", "Resident Fellow, Information Society Project"],
      ["Henry Bradley", "Fellow, Information Society Project and Program for the Study of Reproductive Justice"],
    ];
    return `
    <section class="hero">
      <div class="eyebrow">Information Society Project · Yale Law School · Spring Conference 2027</div>
      <h1>Democratic Decline and Renewal in the Digital Age</h1>
      <div class="ribbon" aria-label="Dates and venue"><b>April 2–3, 2027</b><span>Yale Law School · New Haven, Connecticut</span></div>
      <div class="actions"><a class="btn" href="#schedule">See the schedule</a><a class="btn ghost" href="#speakers">Speakers</a></div>
    </section>

    <section class="section">
      <h2>About the conference</h2>
      <p><em>Democratic Decline and Renewal</em> is the Information Society Project's spring conference for 2027, held at Yale Law School in New Haven on Friday, April 2 and Saturday, April 3. This conference is part of the ISP’s new Project for Constitutional Renewal. Its subject is institutional reform: how the institutions of American constitutional democracy might be repaired, and how its fundamental values might be revived.</p>
      <p>The participants are legal scholars, leaders of the legal profession, and people who have worked in government and in civil society organizations. Over the two days they will take up the question of how to respond to democratic backsliding and to threats to the constitutional order. Each panel is devoted to a single theme and is asked to offer concrete proposals as well as diagnoses: what could change, who could act, and how a proposal could work.</p>
      <p>Before the conference, every contributor writes a short essay of 1,000 to 1,500 words, due by March 24, 2027. The essays are circulated in advance so that participants can see the questions and concerns they share. With the authors' permission, they will later be published together as an online symposium on <a href="https://balkin.blogspot.com" rel="noopener">Balkinization</a>.</p>
    </section>

    <section class="section">
      <h2>How the two days run</h2>
      <div class="cols">
        <div><h3>Friday, April 2</h3><p>The first day opens at 9:00 am with a short welcome, followed by a plenary on rebuilding Congress, two breakout sessions held in parallel, a plenary on campaign finance and the party system, and a plenary on representation and voting rights. A keynote conversation at 5:00 pm closes the day, followed by cocktails and dinner.</p></div>
        <div><h3>Saturday, April 3</h3><p>The second day begins with a plenary on executive power and the administrative state, followed by two parallel breakout sessions and a plenary on court reform. The closing plenary, Civil Society and Directions Forward, is held over lunch. The conference ends at 2:00 pm.</p></div>
        <div><h3>Reading</h3><p>The essays for each panel will be circulated in advance, and participants are asked to read them before the conference.</p></div>
        <div><h3>Attendance</h3><p>The conference is open to the Yale Law School community and a limited number of invited guests. It is an invitation-only, closed-door event.</p></div>
      </div>
    </section>

    <section class="section">
      <h2>Convened by</h2>
      <div class="people">
        ${organizers.map(([n, t]) => `<div class="person"><div class="nm">${esc(n)}</div><div class="af">${esc(t)}</div></div>`).join("")}
      </div>
      <p class="muted">The Information Society Project is an intellectual center at Yale Law School studying the implications of the Internet and new information technologies for law and society.</p>
    </section>`;
  }

  function schedule() {
    return `<div class="eyebrow">Program</div><h1 style="margin-bottom:8px">Schedule</h1>
      <p class="muted">Breakout sessions run in parallel. Click a session for its description.</p>
      <div class="legend">
        <span><i class="sw plenary"></i>Plenary</span><span><i class="sw breakout"></i>Breakout, in parallel</span>
        <span><i class="sw keynote"></i>Keynote conversation</span><span><i class="sw social"></i>Cocktails and dinner</span></div>
      <div class="days" id="days"></div>`;
  }
  function buildGrid() {
    const root = document.getElementById("days"); if (!root) return;
    const row = (day, m, up) => (up ? Math.ceil : Math.floor)((m - day.start) / 15) + 1;
    for (const day of DAYS) {
      const sec = document.createElement("section"); sec.className = "day";
      sec.innerHTML = `<div class="day-head"><h2>${day.name}</h2><p class="when">${day.when}</p></div>`;
      const wrap = document.createElement("div"); wrap.className = "grid-wrap";
      const grid = document.createElement("div"); grid.className = "grid";
      grid.style.gridTemplateRows = `repeat(${row(day, day.end, true) - 1}, var(--row))`;
      for (let m = day.start; m <= day.end; m += 60) {
        const r = row(day, m);
        const tick = document.createElement("div"); tick.className = "tick"; tick.style.gridRow = `${r}`; tick.textContent = ampm(m).replace(" ", ""); grid.appendChild(tick);
        const rule = document.createElement("div"); rule.className = "rule"; rule.style.gridRow = `${r}`; grid.appendChild(rule);
      }
      const card = ev => {
        const isLink = ev.kind !== "pause";
        const d = document.createElement(isLink ? "a" : "div");
        d.className = `ev ${ev.kind}`; if (isLink) d.href = `#${ev.id}`;
        const time = `<span class="t">${fmt(ev.s)}–${fmt(ev.e)}</span>`;
        const k = ev.k ? `<span class="k">${esc(ev.k)}</span>` : "";
        const p = ev.kind === "pause" ? (ev.p ? `<span class="p">${esc(ev.p)}</span>` : "") : `<span class="p">${esc(ev.p || ev.sub || "")}</span>`;
        d.innerHTML = ev.kind === "pause"
          ? `<span class="n">${esc(ev.n)}${ev.n === "Lunch" ? ` · ${fmt(ev.s)}–${fmt(ev.e)}` : ""}</span>${p}`
          : `${time}${k}<span class="n">${esc(ev.n)}</span>${p}`;
        return d;
      };
      const evs = EVENTS.filter(e => e.day === day.id); const done = new Set();
      for (const ev of evs) {
        if (done.has(ev.id)) continue;
        let el;
        if (ev.pair) {
          el = document.createElement("div"); el.className = "pair";
          for (const it of evs.filter(x => x.pair === ev.pair)) { el.appendChild(card(it)); done.add(it.id); }
        } else { el = card(ev); done.add(ev.id); }
        const r1 = row(day, ev.s), r2 = row(day, ev.e, true);
        el.style.gridRow = `${r1} / ${r2}`;
        const rowPx = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--row")) || 28;
        const topOff = ((ev.s - day.start) / 15 - (r1 - 1)) * rowPx;
        const botOff = ((r2 - 1) - (ev.e - day.start) / 15) * rowPx;
        el.style.marginTop = `${topOff + 2}px`; el.style.marginBottom = `${botOff + 2}px`;
        grid.appendChild(el);
      }
      wrap.appendChild(grid); sec.appendChild(wrap); root.appendChild(sec);
    }
  }

  function eventPage(ev) {
    const day = dayOf(ev);
    const i = SESSIONS.indexOf(ev); const prev = SESSIONS[i - 1], next = SESSIONS[i + 1];
    const parallel = ev.pair ? SESSIONS.filter(x => x.pair === ev.pair && x !== ev) : [];
    const isPanel = ev.kind === "plenary" || ev.kind === "breakout" || ev.kind === "keynote";
    const people = SPEAKERS.filter(p => p.s === ev.id);
    return `
    <div class="crumbs"><a href="#home">Home</a> › <a href="#schedule">Schedule</a> › ${esc(ev.n)}</div>
    <div class="evhead ${ev.kind}">
      <div class="k">${esc(ev.k || "")} · ${day.name}</div>
      <h1>${esc(ev.n)}</h1>
      ${ev.sub ? `<p style="font-size:17px;opacity:.9">${esc(ev.sub)}</p>` : ""}
      <div class="meta"><span><b>${day.when}</b></span><span>${ampm(ev.s)} to ${ampm(ev.e)}</span>${parallel.length ? `<span>Held in parallel with ${parallel.map(x => `<a href="#${x.id}">${esc(x.n)}</a>`).join(" and ")}</span>` : ""}${ev.kind === "plenary" || ev.kind === "keynote" ? "<span>All participants</span>" : ""}</div>
    </div>
    <div class="evbody">
      <div class="desc">${(ev.d || []).map(p => `<p>${esc(p)}</p>`).join("")}</div>
      <div>${isPanel ? `<h2>Participants</h2>${people.length ? `<div class="people">${people.map(p => `<div class="person"><div class="nm">${esc(p.n)}</div><div class="af">${esc(p.a)}</div></div>`).join("")}</div>${people.length < 3 ? `<p class="muted" style="margin-top:10px">Further panelists will be added as they are confirmed.</p>` : ""}` : `<div class="tba"><p>${ev.kind === "keynote" ? "The conversation partners" : "The panelists"} will be announced here once confirmed.</p></div>`}` : ""}</div>
    </div>
    <div class="nextprev">
      ${prev ? `<a href="#${prev.id}"><span>Previous</span>${esc(prev.n)}</a>` : "<span></span>"}
      ${next ? `<a href="#${next.id}" style="text-align:right"><span>Next</span>${esc(next.n)}</a>` : ""}
    </div>`;
  }

  function speakersPage() {
    const cards = SPEAKERS.map(p => {
      const ev = p.s ? sessionOf(p.s) : null;
      const where = ev ? `<a href="#${ev.id}">${esc(ev.n)}</a>` : `<span class="muted">Session to be announced</span>`;
      return `<div class="spk"><div class="nm">${esc(p.n)}</div><div class="af">${esc(p.a)}</div>${p.b ? `<div class="bio">${esc(p.b)}</div>` : ""}<div class="ses">${where}</div></div>`;
    }).join("");
    return `<div class="eyebrow">Participants</div><h1 style="margin-bottom:8px">Speakers</h1>
      <p class="muted" style="margin-bottom:18px">Confirmed participants, in alphabetical order. Sessions are shown where the assignment is settled.</p>
      <div class="speakers two-col">${cards}</div>
      <div class="tba" style="margin-top:18px"><p>Further participants from the legal academy, government and civil society will be added as they are confirmed.</p><p class="muted">The program and participants are subject to change.</p></div>`;
  }


  // ---------- router: in-page links switch views here, without leaving the page ----------
  let route = (location.hash || "#home").slice(1).toLowerCase();
  function render() {
    const h = route;
    const app = document.getElementById("app");
    let page = "home";
    if (h === "schedule") { app.innerHTML = schedule(); buildGrid(); page = "schedule"; }
    else if (h === "speakers") { app.innerHTML = speakersPage(); page = "speakers"; }
    else if (sessionOf(h)) { app.innerHTML = eventPage(sessionOf(h)); page = "schedule"; }
    else { app.innerHTML = home(); }
    app.insertAdjacentHTML("beforeend", `<footer><span>Information Society Project, Yale Law School, 127 Wall Street, New Haven, CT 06511</span><span>Program and participants subject to change</span></footer>`);
    document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.getAttribute("href") === `#${page}`));
    window.scrollTo({ top: 0 });
  }
  function go(id) {
    route = id.toLowerCase();
    try { if (location.hash.slice(1).toLowerCase() !== route) history.replaceState(null, "", "#" + route); } catch (e) {}
    render();
  }
  document.addEventListener("click", e => {
    const a = e.target.closest('a[href^="#"]'); if (!a) return;
    e.preventDefault(); go(a.getAttribute("href").slice(1));
  });
  window.addEventListener("hashchange", () => { const h = (location.hash || "#home").slice(1).toLowerCase(); if (h !== route) { route = h; render(); } });
  render();
</script>

</body>
</html>
